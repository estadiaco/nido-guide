<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A6551">
<title>Guest Guide</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Theme is swapped at runtime from config.json -> "theme" -->
<link id="themeLink" rel="stylesheet" href="themes/green.css">

<style>
/* ============================================================
   STRUCTURE ONLY. Every color, font, radius and spacing value
   here comes from a theme token. Do not hardcode colors below.
   ============================================================ */
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  font-size:var(--body-size);
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Splash ---------- */
#splash{
  position:fixed; inset:0; z-index:100;
  background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:8vw; cursor:pointer;
  transition:opacity .5s ease, visibility .5s ease;
}
#splash.hidden{opacity:0; visibility:hidden;}
#splash .rule{width:56px; height:2px; background:var(--accent); margin-bottom:38px;}
#splash .greet{
  font-family:var(--font-display); font-weight:300;
  font-size:clamp(28px, 4.2vw, 46px); color:var(--ink-muted);
  letter-spacing:-0.5px; line-height:1.2;
}
#splash .guest{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(46px, 9vw, 104px); color:var(--brand);
  letter-spacing:-2px; line-height:1.02; margin:6px 0 18px;
}
/* Owner-chosen splash text sizes (md = the default above; sm/lg scale it). */
#splash .greet.size-sm{font-size:clamp(22px, 3.2vw, 34px);}
#splash .greet.size-lg{font-size:clamp(34px, 5.4vw, 60px);}
#splash .guest.size-sm{font-size:clamp(34px, 6.5vw, 76px);}
#splash .guest.size-lg{font-size:clamp(58px, 11.5vw, 132px);}
#splash .place{
  font-family:var(--font-display); font-weight:300;
  font-size:clamp(20px, 3.2vw, 36px); color:var(--ink);
  letter-spacing:-0.3px; line-height:1.3; max-width:16ch;
}
#splash .enter{
  margin-top:56px; font-family:var(--font-mono); font-size:12px;
  letter-spacing:2px; text-transform:uppercase; color:var(--ink-muted);
  animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.45;} 50%{opacity:1;}}

/* ---------- Splash decorative art ----------
   Two SVG blocks (mountain + palm) are always rendered; this default CSS
   shows only the mountain, on every theme. A theme file may override this
   (e.g. themes/green.css hides the mountain and shows/positions the palm
   instead) — that's a deliberate, documented per-theme exception, not the
   general case. Base positioning here is absolute/behind-text/non-interactive
   so an untouched theme's layout is unaffected. */
#splash .splash-art{
  position:absolute; z-index:-1; pointer-events:none;
  right:4vw; top:50%; transform:translateY(-50%);
  width:clamp(200px, 28vw, 380px); height:auto; opacity:.55;
}
#splash .splash-art--palm{ display:none; }
/* Mountain is stroke-drawn (an animated "draw-in" line). The palm (Green
   theme) is a filled silhouette with its own embedded <style>/animation —
   these rules must stay scoped to the mountain specifically, or fill:none
   here would make the palm's paths invisible. */
#splash .splash-art--mountain path{
  fill:none; stroke:var(--accent); stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:1; stroke-dashoffset:1;
  animation:splashArtDraw 9s ease-in-out infinite;
}
#splash .splash-art--mountain .ridge{stroke-width:2;}
#splash .splash-art--mountain .mist{stroke-width:1.4; opacity:.8;}
#splash .splash-art--mountain .mist:nth-of-type(2){animation-delay:1.2s;}
#splash .splash-art--mountain .mist:nth-of-type(3){animation-delay:2s;}
@keyframes splashArtDraw{
  0%,8%{stroke-dashoffset:1;}
  40%,70%{stroke-dashoffset:0;}
  100%{stroke-dashoffset:-1;}
}
@media (max-width:860px){#splash .splash-art{display:none;}}
/* ---------- /Splash decorative art ---------- */
#splash .splash-lang{
  position:absolute; top:clamp(16px,4vw,32px); right:clamp(16px,4vw,32px);
  display:flex; align-items:center; gap:2px;
  border:var(--border) solid var(--line); border-radius:var(--pill); padding:3px;
}
#splash .splash-lang-btn{
  font-family:var(--font-mono); font-weight:500; font-size:12px;
  padding:8px 15px; border-radius:var(--pill); border:none; background:transparent;
  color:var(--ink-muted); cursor:pointer; opacity:.65; letter-spacing:.5px;
}
#splash .splash-lang-btn.active{background:var(--brand); color:var(--on-brand); opacity:1;}
#splash .splash-lang-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- Shell ---------- */
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

header{
  background:var(--brand); color:var(--on-brand);
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px; flex-shrink:0; gap:18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:12px; cursor:pointer;}
.brand .nm{font-family:var(--font-display); font-weight:500; font-size:19px; letter-spacing:-0.2px;}
.brand .tagline{
  font-family:var(--font-mono); font-size:10px; letter-spacing:2px;
  text-transform:uppercase; opacity:.6;
}

.header-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
nav{display:flex; gap:6px; flex-wrap:wrap;}
.navbtn{
  background:transparent; border:var(--border) solid transparent;
  color:var(--on-brand); font-family:var(--font-body); font-weight:500; font-size:14px;
  padding:10px 16px; border-radius:var(--pill); cursor:pointer;
  opacity:.72; transition:opacity .18s ease, background .18s ease;
}
.navbtn:hover{opacity:1;}
.navbtn.active{background:var(--accent); color:var(--on-accent); opacity:1;}
.navbtn:focus-visible{outline:2px solid var(--on-brand); outline-offset:2px;}

.lang-toggle{display:flex; align-items:center; gap:2px; border:var(--border) solid rgba(255,255,255,.28); border-radius:var(--pill); padding:3px;}
.lang-btn{
  font-family:var(--font-mono); font-weight:500; font-size:12px;
  padding:8px 13px; border-radius:var(--pill); border:none; background:transparent;
  color:var(--on-brand); cursor:pointer; opacity:.6; letter-spacing:.5px;
}
.lang-btn.active{background:var(--on-brand); color:var(--brand); opacity:1;}
.lang-btn:focus-visible{outline:2px solid var(--on-brand); outline-offset:2px;}

main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.panel{
  display:none; padding:52px 48px 72px; max-width:1060px; margin:0 auto;
  animation:rise .3s ease;
}
.panel.active{display:block;}
@keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.panel{animation:none;} #splash .enter{animation:none;} #splash .splash-art--mountain path{animation:none; stroke-dashoffset:0;} *{transition:none !important;}}

h1.pagehead{
  font-family:var(--font-display); font-size:var(--h1-size); font-weight:var(--h1-weight);
  letter-spacing:var(--h1-tracking); color:var(--brand); line-height:1.12; margin-bottom:10px;
}
.headrule{width:44px; height:2px; background:var(--accent); margin-bottom:20px;}
.sub{color:var(--ink-muted); font-size:16px; margin-bottom:38px; max-width:62ch; line-height:1.6; white-space:pre-line;}

.card{
  background:var(--surface); border:var(--border) solid var(--line);
  border-radius:var(--radius-lg); padding:var(--card-pad); box-shadow:var(--elevation);
}

/* ---------- Welcome ---------- */
.welcome-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--section-gap); align-items:start;}
.wifi-card .wifi-head{
  font-family:var(--font-display); font-weight:500; font-size:19px;
  color:var(--brand); margin-bottom:22px;
}
.wifi-field{margin-bottom:18px;}
.wifi-field:last-child{margin-bottom:0;}
.wifi-field .label{
  font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--ink-muted); margin-bottom:7px;
}
.wifi-field .value{
  font-family:var(--font-mono); font-size:20px; font-weight:500; color:var(--brand);
  background:var(--surface-alt); padding:15px 18px; border-radius:var(--radius);
  word-break:break-all; -webkit-user-select:text; user-select:text;
}
.note-card .note-head{
  font-family:var(--font-display); font-weight:500; font-size:19px;
  color:var(--brand); margin-bottom:14px;
}
.note-card p{line-height:1.75; color:var(--ink); white-space:pre-line;}
.note-card .host{
  margin-top:22px; padding-top:18px; border-top:var(--border) solid var(--line);
  font-size:14px; color:var(--ink-muted);
}
.note-card .host .ph{font-family:var(--font-mono); color:var(--brand); margin-top:3px;}

.info-strip{display:flex; gap:var(--section-gap); margin-top:var(--section-gap); flex-wrap:wrap;}
.stat{
  background:var(--surface); border:var(--border) solid var(--line);
  border-radius:var(--radius-lg); padding:20px 24px; flex:1; min-width:150px;
  box-shadow:var(--elevation);
}
.stat .num{font-family:var(--font-mono); font-size:21px; font-weight:500; color:var(--brand);}
.stat .lbl{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);
  text-transform:uppercase; letter-spacing:1.5px; margin-top:6px;
}

/* ---------- Guide ---------- */
.guide-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--section-gap);}
.guide-card h3{
  font-family:var(--font-display); font-size:17px; font-weight:500;
  color:var(--brand); margin-bottom:9px;
}
.guide-card p{font-size:16px; line-height:1.65; color:var(--ink-muted); white-space:pre-line;}
.rules-card{grid-column:1 / -1; background:var(--brand-soft); border-color:transparent;}
.rules-card h3{
  font-family:var(--font-display); font-size:17px; font-weight:500;
  color:var(--brand); margin-bottom:12px;
}
.rules-card ul{list-style:none;}
.rules-card li{
  font-size:16px; line-height:1.6; color:var(--ink); padding:8px 0 8px 22px; position:relative;
  white-space:pre-line;
}
.rules-card li::before{
  content:''; position:absolute; left:0; top:16px;
  width:8px; height:2px; background:var(--accent);
}

/* ---------- Check-out ---------- */
.checkout-banner{
  background:var(--brand); color:var(--on-brand); border-radius:var(--radius-lg);
  padding:24px 28px; display:flex; justify-content:space-between; align-items:center;
  margin-bottom:30px; gap:16px; flex-wrap:wrap;
}
.checkout-banner .lbl{font-family:var(--font-display); font-weight:400; font-size:18px; opacity:.85;}
.checkout-banner .time{font-family:var(--font-mono); font-size:28px; font-weight:500;}
.checklist{display:flex; flex-direction:column; gap:12px;}
.step{
  display:flex; align-items:flex-start; gap:18px; background:var(--surface);
  border:var(--border) solid var(--line); border-radius:var(--radius-lg);
  padding:20px 24px; box-shadow:var(--elevation);
}
.step .n{
  font-family:var(--font-mono); font-weight:500; font-size:13px;
  color:var(--accent); background:var(--surface-alt);
  width:30px; height:30px; border-radius:var(--radius);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.step p{font-size:16px; line-height:1.6; color:var(--ink-muted); white-space:pre-line;}
.step strong{color:var(--brand); font-weight:600;}

/* ---------- Recommendations ---------- */
.subtabs{display:flex; gap:8px; margin-bottom:30px; flex-wrap:wrap;}
.subtab{
  font-family:var(--font-body); font-weight:500; font-size:14px;
  padding:11px 20px; border-radius:var(--pill);
  border:var(--border) solid var(--line); background:var(--surface);
  color:var(--ink-muted); cursor:pointer; transition:all .18s ease;
}
.subtab.active{background:var(--brand); color:var(--on-brand); border-color:var(--brand);}
.subtab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.rec-list{display:none; flex-direction:column; gap:12px;}
.rec-list.active{display:flex;}
.rec{
  display:flex; justify-content:space-between; gap:22px; background:var(--surface);
  border:var(--border) solid var(--line); border-radius:var(--radius-lg);
  padding:22px 26px; box-shadow:var(--elevation);
}
.rec .name{font-family:var(--font-display); font-size:17px; font-weight:500; color:var(--brand);}
.rec .desc{font-size:16px; color:var(--ink-muted); margin-top:5px; line-height:1.6; white-space:pre-line;}
.rec .meta{
  font-family:var(--font-mono); font-size:12px; color:var(--accent);
  white-space:nowrap; align-self:flex-start; padding-top:4px;
}

/* ---------- Misc ---------- */
#offlineBadge{
  position:fixed; bottom:18px; right:18px; z-index:50;
  background:var(--brand); color:var(--on-brand);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.5px;
  padding:9px 14px; border-radius:var(--pill); display:none;
}
#offlineBadge.show{display:block;}

#bootError{padding:64px 40px; max-width:680px; margin:0 auto; line-height:1.7;}
#bootError h2{font-family:var(--font-display); color:var(--brand); margin-bottom:14px; font-size:26px; font-weight:500;}
#bootError code{background:var(--surface-alt); padding:2px 7px; border-radius:var(--radius); font-family:var(--font-mono); font-size:13px;}

@media (max-width:860px){
  .welcome-grid, .guide-grid{grid-template-columns:1fr;}
  .panel{padding:36px 22px 64px;}
  header{padding:12px 18px;}
  .rec{flex-direction:column; gap:8px;}
}
::-webkit-scrollbar{width:0px;}
</style>
</head>
<body>

<div id="splash"></div>
<div id="app"></div>
<div id="offlineBadge"></div>

<script>
/* ============================================================
   RENDERER — you should not need to edit this file.
   Content lives in config.json. Look lives in themes/*.css.
   Multi-property: index.html?config=config-other.json
   ============================================================ */

const params = new URLSearchParams(location.search);
// Config source resolution:
//   ?config=<url>  → use it directly, SAME-ORIGIN only (explicit override)
//   ?p=<slug>      → expand to <publishBase>/<slug>/config.json via settings.json
//   otherwise      → the in-repo config.json
// The publish base lives in settings.json (same origin), so no URL is hardcoded here.
// ?config= is restricted to same-origin so a crafted link can't make the tablet
// fetch an attacker-hosted config. Relative paths (config-other.json) stay
// same-origin and are allowed; a cross-origin URL is ignored (falls back below).
function sameOriginConfig(value){
  try { return new URL(value, location.href).origin === location.origin ? value : null; }
  catch(_){ return null; }
}
const configOverride = params.get('config') ? sameOriginConfig(params.get('config')) : null;
let CONFIG_FILE = configOverride || 'config.json';

// Preview mode: the owner dashboard embeds this page as ?preview=1 and streams a
// DRAFT config in over postMessage, so edits render live before publishing. In
// this mode we never fetch, poll, or register the service worker — the parent
// window is the only source of config.
const PREVIEW = params.has('preview');

async function resolveConfigFile(){
  if (configOverride) return;                  // explicit (same-origin) override wins
  const slug = params.get('p');
  if (slug && /^[a-z0-9-]+$/i.test(slug)) {    // guard: only plain slugs build a URL
    try {
      const s = await fetch('settings.json', {cache:'no-cache'}).then(r => r.json());
      if (s && s.publishBase) {
        CONFIG_FILE = s.publishBase.replace(/\/+$/, '') + '/' + slug + '/config.json';
      }
    } catch(_) { /* no settings / offline — fall back to the local config.json */ }
  }
}

let CFG = null, currentLang = null, currentPanel = 'welcome', currentCat = 0;
let servingCached = false;   // true when the guide on screen came from the last-good copy

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');   // also safe inside HTML attributes

/* ---- Last-good config (offline resilience) ----
   Persist the published config on every successful load, keyed by its URL, so a
   powered tablet that briefly loses connectivity keeps showing the guide it
   already had instead of the boot-error screen. Kept in localStorage (the config
   is ~13KB) so it is independent of the service-worker cache version. */
function lastGoodKey(){ return 'guest-guide:lastConfig:' + CONFIG_FILE; }
function saveLastGood(cfg){
  try { localStorage.setItem(lastGoodKey(), JSON.stringify(cfg)); } catch(_){}
}
function loadLastGood(){
  try { const s = localStorage.getItem(lastGoodKey()); return s ? JSON.parse(s) : null; }
  catch(_){ return null; }
}

function applyConfig(cfg, fromCache){
  CFG = cfg;
  servingCached = !!fromCache;
  // Only a local themes/*.css path (mirrors server-side validateConfig) — a hostile
  // config (via preview or ?config=) can't point the stylesheet at an external or
  // javascript: URL.
  if (typeof cfg.theme === 'string' && /^themes\/[\w-]+\.css$/.test(cfg.theme)) {
    document.getElementById('themeLink').href = cfg.theme;
  }
  currentLang = (cfg.languages && cfg.languages[0] && cfg.languages[0].code) || 'en';
  renderSplash();
  render();
  updateOfflineBadge();
  scheduleIdleReset();   // arm the idle → welcome-splash timer (inert in PREVIEW)
}

function showBootError(err){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app').innerHTML =
    '<div id="bootError"><h2>Couldn\'t load the guide</h2>' +
    '<p>The renderer could not read <code>' + esc(CONFIG_FILE) + '</code>.</p>' +
    '<p>Usually this means a JSON syntax error (a stray comma is the usual culprit), ' +
    'or the page was opened directly from the file system. It must be served over ' +
    'http:// or https:// — GitHub Pages works, double-clicking the file does not.</p>' +
    '<p style="margin-top:16px;color:var(--ink-muted);font-size:14px;">Details: ' + esc(err.message) + '</p></div>';
}

async function boot(){
  await resolveConfigFile();
  try {
    const r = await fetch(CONFIG_FILE, {cache:'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const cfg = await r.json();
    saveLastGood(cfg);              // refresh the offline copy on every good load
    applyConfig(cfg, false);
  } catch (err) {
    const cached = loadLastGood();  // network/Supabase unreachable — fall back to last-good
    if (cached) applyConfig(cached, true);
    else showBootError(err);
  }
}

/* ---------- Splash ---------- */
function renderSplash(){
  const ui = CFG[currentLang].ui, p = CFG.property;
  const splash = document.getElementById('splash');
  const sz = s => (s === 'sm' || s === 'lg') ? s : 'md';
  splash.innerHTML = `
    <svg class="splash-art splash-art--mountain" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path class="ridge" pathLength="1" d="M10,230 C50,190 70,140 110,115 C140,97 150,80 175,90 C195,98 190,120 220,122 C260,125 265,75 305,50 C330,35 350,50 365,65 C378,78 385,95 392,115"></path>
      <path class="mist" pathLength="1" d="M132,58 C152,50 172,50 192,58"></path>
      <path class="mist" pathLength="1" d="M238,32 C256,25 274,25 290,32"></path>
    </svg>
    <svg class="splash-art splash-art--palm" viewBox="0 0 320 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <style>
        .palm-tree{transform-box:fill-box;transform-origin:50% 100%;animation:palmSway 5s ease-in-out infinite alternate;}
        .palm-crown{transform-box:fill-box;transform-origin:50% 100%;animation:palmCrown 5s ease-in-out -1.2s infinite alternate;}
        @keyframes palmSway{from{transform:rotate(-2.2deg);}to{transform:rotate(2.2deg);}}
        @keyframes palmCrown{from{transform:translateY(0) rotate(-1.2deg);}to{transform:translateY(-3.5px) rotate(1.2deg);}}
        @media (prefers-reduced-motion:reduce){.palm-tree,.palm-crown{animation:none;}}
      </style>

/* ---------- Layout presets (curated pick-list) ----------
   Each layout is an ordered list of tabs; a tab picks a label, heading, optional
   sub-line, and a body composed from the shared section renderers below. Adding a
   layout here (and verifying it against each theme) is how the "library" grows.
   An unknown or absent CFG.layout falls back to "standard" — existing configs
   render exactly as before. Layouts arrange content only; they never style. */
function panel(id, head, sub, inner){
  return `
  <section class="panel ${currentPanel===id?'active':''}" id="panel-${id}">
    <h1 class="pagehead">${esc(head)}</h1>
    <div class="headrule"></div>
    ${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
    ${inner}
  </section>`;
}

const LAYOUTS = {
  standard: [
    { id:'welcome',  label:(L,ui)=>ui.navWelcome,   head:(L,ui)=>ui.welcomeHead,  sub:(L)=>L.welcome.sub, body:(L,ui,p)=>bodyWelcome(L,ui,p) },
    { id:'guide',    label:(L,ui)=>ui.navGuide,     head:(L,ui)=>ui.guideHead,    sub:(L)=>L.guide.sub,   body:(L)=>`<div class="guide-grid">${bodyCards(L)}${bodyRulesCard(L)}</div>` },
    { id:'checkout', label:(L,ui)=>ui.navCheckout,  head:(L,ui)=>ui.checkoutHead, sub:()=>null,           body:(L,ui,p)=>bodyCheckout(L,ui,p) },
    { id:'local',    label:(L,ui)=>ui.navLocal,     head:(L,ui)=>ui.localHead,    sub:()=>null,           body:(L)=>bodyLocal(L) },
  ],
  'rules-as-tab': [
    { id:'welcome',  label:(L,ui)=>ui.navWelcome,   head:(L,ui)=>ui.welcomeHead,   sub:(L)=>L.welcome.sub, body:(L,ui,p)=>bodyWelcome(L,ui,p) },
    { id:'guide',    label:(L,ui)=>ui.navGuide,     head:(L,ui)=>ui.guideHead,     sub:(L)=>L.guide.sub,   body:(L)=>`<div class="guide-grid">${bodyCards(L)}</div>` },
    { id:'rules',    label:(L,ui)=>ui.navRules || L.guide.rulesTitle, head:(L)=>L.guide.rulesTitle,  sub:()=>null,           body:(L)=>`<div class="guide-grid">${bodyRulesCard(L, false)}</div>` },
    { id:'checkout', label:(L,ui)=>ui.navCheckout,  head:(L,ui)=>ui.checkoutHead,  sub:()=>null,           body:(L,ui,p)=>bodyCheckout(L,ui,p) },
    { id:'local',    label:(L,ui)=>ui.navLocal,     head:(L,ui)=>ui.localHead,     sub:()=>null,           body:(L)=>bodyLocal(L) },
  ],
};

/* ---------- Shell ---------- */
function render(){
  const L = CFG[currentLang], ui = L.ui, p = CFG.property;
  const tabs = LAYOUTS[CFG.layout] || LAYOUTS.standard;
  if (!tabs.some(t => t.id === currentPanel)) currentPanel = tabs[0].id;

  document.getElementById('app').innerHTML = `
    <header>
      <div class="brand" id="homeBtn" title="${esc(ui.navHome)}">
        <span class="nm">${esc(ui.displayName || p.name)}</span>
        <span class="tagline">${esc(ui.tagline)}</span>
      </div>
      <div class="header-right">
        <nav>
          ${tabs.map(t => `<button class="navbtn ${t.id===currentPanel?'active':''}" data-panel="${t.id}">${esc(t.label(L, ui, p))}</button>`).join('')}
        </nav>
        <div class="lang-toggle">
          ${CFG.languages.map(l => `<button class="lang-btn ${l.code===currentLang?'active':''}" data-lang="${esc(l.code)}">${esc(l.label)}</button>`).join('')}
        </div>
      </div>
    </header>
    <main>
      ${tabs.map(t => panel(t.id, t.head(L, ui, p), t.sub(L, ui, p), t.body(L, ui, p))).join('')}
    </main>`;

  document.documentElement.lang = currentLang;
  document.title = (ui.displayName || p.name) + ' — ' + ui.tagline;
  wire();
  updateOfflineBadge();
}

function bodyWelcome(L, ui, p){
  return `
    <div class="welcome-grid">
      <div class="card wifi-card">
        <div class="wifi-head">${esc(ui.wifiTitle)}</div>
        <div class="wifi-field">
          <div class="label">${esc(ui.wifiNetworkLabel)}</div>
          <div class="value">${esc(p.wifiNetwork)}</div>
        </div>
        <div class="wifi-field">
          <div class="label">${esc(ui.wifiPasswordLabel)}</div>
          <div class="value">${esc(p.wifiPassword)}</div>
        </div>
      </div>
      <div class="card note-card">
        <div class="note-head">${esc(ui.hostNoteTitle)}</div>
        <p>${esc(L.welcome.hostNote)}</p>
        <div class="host">
          <div>${esc(ui.hostedBy)} ${esc(ui.hostName || p.hostName)}</div>
        </div>
      </div>
    </div>
    <div class="info-strip">
      <div class="stat"><div class="num">${esc(p.checkin)}</div><div class="lbl">${esc(ui.checkinLbl)}</div></div>

/* House Guide cards (the grid wrapper is added by whichever tab hosts them). */
function bodyCards(L){
  return L.guide.cards.map(c => `
    <div class="card guide-card">
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.body)}</p>
    </div>`).join('');
}

/* House Rules as a single card (grid wrapper added by the hosting tab). The
   inner title is dropped when the rules are their own tab, since the tab
   heading already says "House Rules". */
function bodyRulesCard(L, withTitle = true){
  return `
    <div class="card guide-card rules-card">
      ${withTitle ? `<h3>${esc(L.guide.rulesTitle)}</h3>` : ''}
      <ul>${L.guide.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    </div>`;
}

function bodyCheckout(L, ui, p){
  return `
    <div class="checkout-banner">
      <span class="lbl">${esc(ui.checkoutBannerLabel)}</span>
      <span class="time">${esc(p.checkout)}</span>
    </div>
    <div class="checklist">
      ${L.checkout.steps.map((s,i) => `
        <div class="step">
          <div class="n">${i+1}</div>
          <p><strong>${esc(s.title)}</strong> — ${esc(s.body)}</p>
        </div>`).join('')}
    </div>
    <p class="sub" style="margin-top:30px;">${esc(L.checkout.note)}</p>`;
}

function bodyLocal(L){
  const cats = L.local.categories;
  return `
    <div class="subtabs">
      ${cats.map((c,i) => `<button class="subtab ${i===currentCat?'active':''}" data-cat="${i}">${esc(c.label)}</button>`).join('')}
    </div>
    ${cats.map((c,i) => `
      <div class="rec-list ${i===currentCat?'active':''}" data-list="${i}">
        ${c.items.map(it => `
          <div class="rec">
            <div>
              <div class="name">${esc(it.name)}</div>
              ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ''}
            </div>
            ${it.meta ? `<div class="meta">${esc(it.meta)}</div>` : ''}
          </div>`).join('')}
      </div>`).join('')}`;
}

function wire(){
  document.getElementById('homeBtn').addEventListener('click', () => {
    document.getElementById('splash').classList.remove('hidden');
  });

  document.querySelectorAll('.navbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPanel = btn.dataset.panel;
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.panel').forEach(pn => pn.classList.toggle('active', pn.id === 'panel-' + currentPanel));
      document.querySelector('main').scrollTop = 0;
    });
  });

  document.querySelectorAll('.subtab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = parseInt(btn.dataset.cat, 10);
      document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.rec-list').forEach(l => l.classList.toggle('active', parseInt(l.dataset.list,10) === currentCat));
    });
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      renderSplash();
      const wasHidden = true; // keep splash dismissed when switching language mid-visit
      render();
      if (wasHidden) document.getElementById('splash').classList.add('hidden');
    });
  });
}

function updateOfflineBadge(){
  const b = document.getElementById('offlineBadge');
  if(!CFG) return;
  b.textContent = CFG[currentLang].ui.offlineNotice || '';
  b.classList.toggle('show', !navigator.onLine || servingCached);
}
window.addEventListener('online', updateOfflineBadge);
window.addEventListener('offline', updateOfflineBadge);

/* ---- Service worker ---- */
if (!PREVIEW && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(e => console.log('SW failed:', e));
  });
}

/* ---- Poll the published config for changes; reload only if it changed ----
   Version-aware: if the config carries a numeric "version" (published by the
   dashboard), reload when it changes. Configs without a version — like a
   hand-edited config.json — fall back to comparing the raw text.
   POLL_INTERVAL_MS is the worst-case wait between a Publish and the tablet
   updating. Lower = snappier, but each poll GETs the full config (~15KB), so it
   costs a bit more Supabase egress. 60s is a good balance; drop to 30s if you
   want snappier updates and don't mind ~2x the polling traffic. */
const POLL_INTERVAL_MS = 60 * 1000;
let lastConfigText = null, lastVersion = null;
setInterval(async () => {
  if (PREVIEW || !navigator.onLine) return;
  try {
    const res = await fetch(CONFIG_FILE + '?t=' + Date.now(), {cache:'no-store'});
    const text = await res.text();
    let version = null;
    try { const v = JSON.parse(text).version; if (typeof v === 'number') version = v; } catch(_){}
    if (version !== null) {
      if (lastVersion !== null && version !== lastVersion) location.reload();
      lastVersion = version;
    } else if (lastConfigText !== null && text !== lastConfigText) {
      location.reload();
    }
    lastConfigText = text;
  } catch(e){ /* offline or blocked — ignore */ }
}, POLL_INTERVAL_MS);

/* ---- Idle → return to the welcome splash (attract screen) ----
   After IDLE_RESET_MS with no interaction, fade the welcome splash back over the
   guide and reset it to the first tab + language, so the next guest starts fresh.
   Also re-shows the splash when the page becomes visible again (screen sleep→wake).
   Pure web — no fully.* — so the guide stays portable to any kiosk shell. Inert in
   PREVIEW so the dashboard's live preview is never taken over. */
const IDLE_RESET_MS = 5 * 60 * 1000;
let idleTimer = null;
function returnToSplash(){
  if (PREVIEW || !CFG) return;
  const splash = document.getElementById('splash');
  if (!splash || !splash.classList.contains('hidden')) return; // already on the splash
  currentLang  = (CFG.languages && CFG.languages[0] && CFG.languages[0].code) || currentLang;
  currentPanel = 'welcome';   // clean initial tab (mirrors the boot default)
  currentCat   = 0;
  renderSplash();
  render();
  const main = document.querySelector('main'); if (main) main.scrollTop = 0;
  splash.classList.remove('hidden'); // fades in via the existing 0.5s transition
}
function scheduleIdleReset(){
  if (PREVIEW) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(returnToSplash, IDLE_RESET_MS);
}
['pointerdown','keydown'].forEach(ev =>
  window.addEventListener(ev, scheduleIdleReset, {passive:true}));
document.addEventListener('visibilitychange', () => {
  if (PREVIEW) return;
  if (document.hidden) { clearTimeout(idleTimer); }
  else { returnToSplash(); scheduleIdleReset(); }
});

/* ---- Preview bridge: render DRAFT configs streamed from the owner dashboard ----
   Active only in ?preview=1 mode (see PREVIEW above). The dashboard embeds this
   page in an iframe and posts the draft config on every edit, so owners see
   changes live before publishing. Origin-guarded; carries no secrets. */
// Vercel preview deploys for THIS project only — e.g. nido-dashboard.vercel.app or
// nido-dashboard-<hash>-<scope>.vercel.app — never the shared *.vercel.app space.
// Update the "nido-dashboard" prefix here if the Vercel project is renamed.
const DASH_VERCEL = /^nido-dashboard(-[a-z0-9-]+)?\.vercel\.app$/;
function isAllowedPreviewOrigin(origin){
  try {
    const u = new URL(origin);
    if (u.hostname === 'localhost' || u.hostname === '127.0.0.1') return true; // dev
    if (u.hostname === 'app.estadiaco.com') return true;                       // prod dashboard
    if (DASH_VERCEL.test(u.hostname)) return true;                             // this project's preview deploys
  } catch(_){}
  return false;
}
function initPreview(){
  window.addEventListener('message', (e) => {
    if (!isAllowedPreviewOrigin(e.origin)) return;
    const d = e.data;
    if (!d || d.type !== 'nido-preview' || !d.config) return;
    try {
      applyConfig(d.config, false);
      if (d.lang && d.config[d.lang]) {   // follow the language the owner is editing
        currentLang = d.lang;
        renderSplash();
        render();
      }
    } catch(err){ console.log('preview render failed:', err); }
  });
  // Let the parent know we're ready to receive the first draft.
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'nido-preview-ready' }, '*');
  }
}

if (PREVIEW) initPreview(); else boot();
</script>
